<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent}
  #cv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="./spine-webgl-3.8.js"></script>
<script>
(function () {
  'use strict';
  var SPINE = window.spine;
  var GAME_W = 720, GAME_H = 1280;
  var cv = document.getElementById('cv');
  var key = new URLSearchParams(location.search).get('key') || 'duanwu';

  function gameFrame(data) {
    var dw = data && data.width, dh = data && data.height;
    var dx = data && data.x, dy = data && data.y;
    var sane = [dw, dh, dx, dy].every(Number.isFinite)
      && dw > 600 && dw < 1400 && dh > 1100 && dh < 2000;
    var cx = sane ? dx + dw / 2 : 0;
    var cy = sane ? dy + dh / 2 : 0;
    return { x: cx - GAME_W / 2, y: cy - GAME_H / 2, width: GAME_W, height: GAME_H };
  }

  function fetchText(url) { return fetch(url).then(function (r) { return r.text(); }); }
  function fetchBuffer(url) { return fetch(url).then(function (r) { return r.arrayBuffer(); }); }
  function loadImage(src) {
    return new Promise(function (res, rej) {
      var img = new Image();
      img.onload = function () { res(img); };
      img.onerror = function () { rej(new Error('img ' + src)); };
      img.src = src;
    });
  }

  function start() {
    if (!SPINE) { document.title = 'err:no spine'; return; }
    var atlasUrl = './jieqi_' + key + '.atlas';
    var binUrl = './jieqi_' + key + '.bin';
    var texUrl = './jieqi_' + key + '.webp';
    document.title = 'loading';

    Promise.all([loadImage(texUrl), fetchText(atlasUrl), fetchBuffer(binUrl)])
      .then(function (a) {
        var img = a[0], atlasText = a[1], binBuf = a[2];
        var gl = cv.getContext('webgl', {
          alpha: true, premultipliedAlpha: false,
          antialias: true, preserveDrawingBuffer: true
        });
        if (!gl) { document.title = 'err:no webgl'; return; }

        // 按屏幕物理分辨率渲染（devicePixelRatio），不再固定 720×1280 被拉伸导致模糊
        function resize() {
          var dpr = Math.max(window.devicePixelRatio || 1, 1);
          var w = Math.round(window.innerWidth * dpr);
          var h = Math.round(window.innerHeight * dpr);
          if (w > 0 && h > 0 && (cv.width !== w || cv.height !== h)) {
            cv.width = w; cv.height = h;
          }
        }
        resize();

        var ctx = new SPINE.webgl.ManagedWebGLRenderingContext(gl);
        var tex = new SPINE.webgl.GLTexture(ctx, img);
        var atlas = new SPINE.TextureAtlas(atlasText, function () { return tex; });
        var data = new SPINE.SkeletonBinary(new SPINE.AtlasAttachmentLoader(atlas))
          .readSkeletonData(new Uint8Array(binBuf));

        var skeleton = new SPINE.Skeleton(data);
        var stateData = new SPINE.AnimationStateData(data);
        stateData.defaultMix = 0.2;
        var state = new SPINE.AnimationState(stateData);

        var anims = (data.animations || []).map(function (x) { return x.name; });
        var anim = anims.indexOf('loop') >= 0 ? 'loop' : anims[0];
        state.setAnimation(0, anim, true);

        state.update(0.05);
        state.apply(skeleton);
        skeleton.updateWorldTransform();

        var renderer = new SPINE.webgl.SceneRenderer(cv, ctx);
        var box = gameFrame(data);
        var view = { cx: box.x + box.width / 2, cy: box.y + box.height / 2 };

        var last = 0;
        function frame(now) {
          resize();
          var dt = last ? Math.min((now - last) / 1000, 0.1) : 0;
          last = now;
          state.update(dt);
          state.apply(skeleton);
          skeleton.updateWorldTransform();
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          // cover 取景：把 720×1280 设计画布按屏幕比例放大铺满（保留原网站裁剪观感）
          var s = Math.max(cv.width / GAME_W, cv.height / GAME_H); // 像素/世界单位
          gl.viewport(0, 0, cv.width, cv.height);
          renderer.begin();
          renderer.camera.setViewport(cv.width, cv.height);
          renderer.camera.position.x = view.cx;
          renderer.camera.position.y = view.cy;
          renderer.camera.zoom = 1 / s;
          renderer.drawSkeleton(skeleton, false);
          renderer.end();
        }
        // rAF 主循环；半屏面板/未获焦窗口里 rAF 可能被系统节流甚至暂停，
        // 用定时器兜底驱动，保证任何窗口状态下背景都在渲染
        requestAnimationFrame(function loop(now) {
          requestAnimationFrame(loop);
          try { frame(now); } catch (e) { document.title = 'err:' + (e && e.message); }
        });
        setInterval(function () {
          if (performance.now() - last >= 40) {
            try { frame(performance.now()); } catch (e) {}
          }
        }, 40);
        document.title = 'ok';
      })
      .catch(function (e) { document.title = 'err:' + (e && e.message); });
  }

  if (document.readyState === 'complete') start();
  else window.addEventListener('load', start);
})();
</script>
</body>
</html>
